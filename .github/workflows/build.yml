name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows i686 (MSVC)
            os: windows-latest
            cmake_arch: Win32
            target_triple: i686-pc-windows-msvc
            artifact_suffix: i686-pc-windows-msvc-release
          - label: Windows x86_64 (MSVC)
            os: windows-latest
            cmake_arch: x64
            target_triple: x86_64-pc-windows-msvc
            artifact_suffix: x86_64-pc-windows-msvc-release
          - label: Linux x86_64 (GCC)
            os: ubuntu-latest
            artifact_suffix: x86_64-unknown-linux-gnu-gcc-release
          - label: macOS (Apple Clang, runner native architecture)
            os: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(sed -nE 's/.*kVersion = "([^"]+)".*/\1/p' src/include/version.hpp | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read kVersion from src/include/version.hpp" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set macOS target name
        id: macos_target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch="$(uname -m)"
          echo "artifact_suffix=${arch}-apple-darwin-appleclang-release" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -A ${{ matrix.cmake_arch }}
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel


      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: qwqwq-${{ steps.version.outputs.version }}-${{ matrix.artifact_suffix }}
          path: build/Release/qwqwq.exe
          if-no-files-found: error

      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: qwqwq-${{ steps.version.outputs.version }}-${{ matrix.artifact_suffix }}
          path: build/qwqwq
          if-no-files-found: error

      - name: Upload macOS executable
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: qwqwq-${{ steps.version.outputs.version }}-${{ steps.macos_target.outputs.artifact_suffix }}
          path: build/qwqwq
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download raw executables
        uses: actions/download-artifact@v8
        with:
          pattern: qwqwq-*
          path: release-binaries
          merge-multiple: false

      - name: Package each executable once
        shell: bash
        run: |
          assets="$PWD/release-assets"
          staging="$PWD/release-staging"
          mkdir -p "$assets" "$staging"
          shopt -s nullglob
          artifact_dirs=(release-binaries/qwqwq-*)
          if [[ ${#artifact_dirs[@]} -eq 0 ]]; then
            echo "No build artifacts were downloaded" >&2
            exit 1
          fi

          # The archive holds one folder named qwqwq, with the executable and
          # the standard headers beside it.
          for artifact_dir in "${artifact_dirs[@]}"; do
            artifact_name="${artifact_dir##*/}"
            package="$staging/$artifact_name/qwqwq"
            mkdir -p "$package"
            cp -R awa "$package/awa"

            if [[ -f "$artifact_dir/qwqwq.exe" ]]; then
              cp "$artifact_dir/qwqwq.exe" "$package/qwqwq.exe"
              (cd "$staging/$artifact_name" && zip -qr "$assets/${artifact_name}.zip" qwqwq)
            elif [[ -f "$artifact_dir/qwqwq" ]]; then
              cp "$artifact_dir/qwqwq" "$package/qwqwq"
              chmod +x "$package/qwqwq"
              tar -czf "$assets/${artifact_name}.tar.gz" -C "$staging/$artifact_name" qwqwq
            else
              echo "Expected qwqwq or qwqwq.exe in $artifact_dir" >&2
              exit 1
            fi
          done
          ls -lh "$assets"

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}